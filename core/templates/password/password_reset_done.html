<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইমেইল পাঠানো হয়েছে - অণুপাঠ (OnoPath)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md text-center border border-gray-100">
        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
            ✓
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">ইমেইল পাঠানো হয়েছে</h2>
        <p class="text-sm text-gray-600 mb-6">
            আপনার ইমেইলে পাসওয়ার্ড রিসেট করার নির্দেশনাসহ একটি লিংক পাঠানো হয়েছে। দয়া করে আপনার ইনবক্স (অথবা স্প্যাম ফোল্ডার) চেক করুন।
        </p>
        <a href="{% url 'login' %}" class="inline-block w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 rounded-xl transition duration-200">
            লগইন করুন
        </a>
    </div>
</body>
</html>
