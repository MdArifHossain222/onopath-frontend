<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পাসওয়ার্ড পুনরুদ্ধার - অণুপাঠ (OnoPath)</title>
    <!-- Tailwind CSS CDN (আপনার প্রজেক্টের স্টাইলের সাথে মিল রাখার জন্য) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-gray-100">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">পাসওয়ার্ড ভুলে গেছেন?</h2>
            <p class="text-sm text-gray-500 mt-1">আপনার অ্যাকাউন্টটি পুনরুদ্ধার করতে রেজিস্টার্ড ইমেইলটি লিখুন।</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            {% for field in form %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 rounded-xl transition duration-200">
                রিসেট লিংক পাঠান 🚀
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="{% url 'login' %}" class="text-sm text-emerald-600 hover:underline">লগইন পেজে ফিরে যান</a>
        </div>
    </div>
</body>
</html>
